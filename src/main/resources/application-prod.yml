spring:
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false

logging:
  level:
    root: info
    io.github.arubaid: info
    org.springframework.security: WARN

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}

  mail:
    mode: smtp
    from: ${MAIL_FROM:no-reply@template.local}

  password-reset:
    url: ${PASSWORD_RESET_URL}
    expiration: 15m

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false