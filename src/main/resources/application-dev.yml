spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/spring_boot_enterprise_template
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    io.github.arubaid: DEBUG
    org.springframework.security: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  mail:
    mode: log
    from: ${MAIL_FROM:no-reply@template.local}

  password-reset:
    url: ${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
    expiration: 15m

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true